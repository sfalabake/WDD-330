<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Solomon Oluwadunsin Falabake | Sleep Team 2" />
    <meta
      name="description"
      content="Sleep Outside checkout page for reviewing and placing your outdoor camping gear order."
    />
    <title>Sleep Outside | Checkout</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
    <script src="../js/lastModified.js" defer></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider checkout">
      <h2>Review &amp; Place your Order</h2>
      <section class="checkout-form">
        <form name="checkout">
          <fieldset>
            <legend>Shipping</legend>
            <div class="checkout__name">
              <label for="fname">First Name</label>
              <input type="text" id="fname" name="fname" required />
              <label for="lname">Last Name</label>
              <input type="text" id="lname" name="lname" required />
            </div>
            <div class="checkout__address">
              <label for="street">Street Address</label>
              <input type="text" id="street" name="street" required />
              <label for="city">City</label>
              <input type="text" id="city" name="city" required />
              <label for="state">State</label>
              <input type="text" id="state" name="state" required />
              <label for="zip">Zip Code</label>
              <input type="text" id="zip" name="zip" required />
            </div>
          </fieldset>

          <fieldset>
            <legend>Payment</legend>
            <label for="cardNumber">Credit Card Number</label>
            <input type="text" id="cardNumber" name="cardNumber" required />
            <label for="expiration">Expiration Date</label>
            <input
              type="text"
              id="expiration"
              name="expiration"
              placeholder="MM/YY"
              required
            />
            <label for="code">Security Code</label>
            <input type="text" id="code" name="code" required />
          </fieldset>

          <fieldset class="checkout-summary">
            <legend>Order Summary</legend>
            <ul>
              <li>
                <label for="cartTotal">
                  Item Subtotal (<span id="num-items"></span>)
                </label>
                <p name="cartTotal" id="cartTotal"></p>
              </li>
              <li>
                <label for="shipping">Shipping Estimate</label>
                <p id="shipping"></p>
              </li>
              <li>
                <label for="tax">Tax</label>
                <p id="tax"></p>
              </li>
              <li>
                <label for="orderTotal"><b>Order Total</b></label>
                <p id="orderTotal"></p>
              </li>
            </ul>
          </fieldset>

          <button id="checkoutSubmit" type="submit">Checkout</button>
        </form>
      </section>
    </main>

    <footer id="main-footer">
      <p>Last Modified: <span id="lastModified"></span></p>
    </footer>
  </body>
</html>
