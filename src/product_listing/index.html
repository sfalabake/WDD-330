<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Solomon Oluwadunsin Falabake | Sleep Team 2" />
    <meta
      name="description"
      content="Dynamic product listing page for Sleep Outside categories."
    />
    <title>Sleep Outside | Top Products</title>
    <!-- Use absolute path so Vite handles it properly from the subfolder -->
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/product-listing.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>
    <main class="divider">
      <section class="products">
        <h2 id="category-title">Top Products</h2>
        <ul class="product-list"></ul>
      </section>
    </main>
    <footer id="main-footer"></footer>
    
    <script>
      const footer = document.getElementById('main-footer');
      const lastModifiedNode = document.createElement('p');
      lastModifiedNode.innerHTML = `Last Modification: <span id="lastModified">${document.lastModified}</span>`;
      footer.parentNode.insertBefore(lastModifiedNode, footer.nextSibling);
    </script>
  </body>
</html>
